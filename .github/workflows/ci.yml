name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Python User Service — 빌드 및 검증
  # ──────────────────────────────────────────────
  python-build:
    name: Python User Service Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-user-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate gRPC code
        run: |
          python -m grpc_tools.protoc \
            -I../proto \
            --python_out=. \
            --grpc_python_out=. \
            ../proto/user.proto

      - name: Verify import
        run: python -c "import user_pb2; import user_pb2_grpc; print('Proto import OK')"

  # ──────────────────────────────────────────────
  # NestJS API Gateway — 빌드 및 타입체크
  # ──────────────────────────────────────────────
  nestjs-build:
    name: NestJS API Gateway Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nodejs-api-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Copy proto file
        run: mkdir -p proto && cp ../proto/user.proto proto/

      - name: Build TypeScript
        run: npm run build

  # ──────────────────────────────────────────────
  # Docker 이미지 빌드 검증
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [python-build, nestjs-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build user-service image
        run: docker build -f python-user-service/Dockerfile -t user-service:ci .

      - name: Build api-gateway image
        run: docker build -f nodejs-api-gateway/Dockerfile -t api-gateway:ci .
