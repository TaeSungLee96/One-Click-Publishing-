apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: one-click-publishing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
        app.kubernetes.io/part-of: one-click-publishing
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: user-service
          image: OCIR_ENDPOINT_PLACEHOLDER/OCIR_NAMESPACE_PLACEHOLDER/OCIR_REPO_PREFIX_PLACEHOLDER/user-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 50051
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)"
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import grpc; ch = grpc.insecure_channel('localhost:50051'); grpc.channel_ready_future(ch).result(timeout=2)"
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: one-click-publishing
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/part-of: one-click-publishing
    spec:
      imagePullSecrets:
        - name: ocir-secret
      containers:
        - name: api-gateway
          image: OCIR_ENDPOINT_PLACEHOLDER/OCIR_NAMESPACE_PLACEHOLDER/OCIR_REPO_PREFIX_PLACEHOLDER/api-gateway:IMAGE_TAG_PLACEHOLDER
          ports:
            - containerPort: 3000
          env:
            - name: USER_SERVICE_HOST
              value: user-service-svc:50051
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
