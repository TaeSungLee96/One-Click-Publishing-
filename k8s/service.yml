apiVersion: v1
kind: Service
metadata:
  name: user-service-svc
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: one-click-publishing
spec:
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-svc
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: one-click-publishing
spec:
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  type: LoadBalancer
